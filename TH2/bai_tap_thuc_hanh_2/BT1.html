<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }

    .container {
        width: 100%;
        max-width: 900px;
        background: #fff;
        padding: 40px;
        border: 1px solid #ccc;
    }

    h2 {
        margin-bottom: 25px;
        font-weight: normal;
    }

    .row {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }

    .form-group {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    label {
        margin-bottom: 6px;
        font-size: 14px;
    }

    input,
    textarea {
        padding: 12px;
        border: 1px solid #ccc;
        font-size: 14px;
        width: 100%;
        outline: none;
        transition: 0.3s;
    }

    input:focus,
    textarea:focus {
        border-color: #000000;
    }

    textarea {
        resize: vertical;
        min-height: 200px;
    }

    .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
    }

    button {
        background-color: #6cb6e3;
        border-radius: 4px;
        padding: 12px 25px;
        color: white;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #2b00ff;
    }

    .note {
        font-size: 13px;
        color: #777;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .row {
            flex-direction: column;
        }

        .bottom {
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h2>Get in touch with us by filling contact form below</h2>

    <form>
        <div class="row">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" placeholder="Enter your email address" required>
            </div>
        </div>

        <div class="form-group" style="margin-bottom:20px;">
            <label>Subject</label>
            <input type="text" placeholder="Enter your subject">
        </div>

        <div class="form-group">
            <label>Message *</label>
            <textarea placeholder="Your message here..." required></textarea>
        </div>

        <div class="bottom">
            <button type="submit">Send message</button>
            <div class="note">
                * Please fill all required form field, thanks!
            </div>
        </div>
    </form>
</div>

</body>
</html>
