<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2.2 – Form Đặt Hàng</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.sub { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

    .form-group { margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 8px 10px; border: 1.5px solid #ccc;
      border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; font-family: Arial, sans-serif;
    }
    input.valid,   select.valid,   textarea.valid   { border-color: #22c55e; }
    input.invalid, select.invalid, textarea.invalid { border-color: #ef4444; }
    textarea { resize: vertical; min-height: 80px; }

    .error-msg { color: #ef4444; font-size: 0.75rem; margin-top: 4px; display: none; }
    .error-msg.show { display: block; }

    .char-count { font-size: 0.75rem; color: #666; text-align: right; margin-top: 3px; }
    .char-count.over { color: #ef4444; font-weight: 600; }

    /* Radio thanh toán */
    .payment-group { display: flex; gap: 10px; }
    .payment-group label {
      flex: 1; text-align: center; padding: 10px 6px;
      border: 1.5px solid #ccc; border-radius: 6px;
      cursor: pointer; font-weight: 400; font-size: 0.85rem;
    }
    .payment-group input[type="radio"] { display: none; }
    .payment-group label:has(input:checked) { border-color: #6366f1; background: #eef2ff; color: #4338ca; font-weight: 600; }

    /* Tổng tiền */
    .price-box {
      background: #f3f4f6; border-radius: 8px; padding: 12px 16px;
      margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .price-box .label { font-size: 0.85rem; color: #555; }
    .price-box .amount { font-size: 1.3rem; font-weight: 700; color: #16a34a; }

    hr { border: none; border-top: 1px solid #e5e7eb; margin: 16px 0 10px; }

    button[type="submit"] {
      width: 100%; padding: 10px; background: #ef4444; color: white;
      border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; margin-top: 6px;
    }
    button[type="submit"]:hover { background: #dc2626; }

    /* Confirm dialog */
    #confirmOverlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); align-items: center; justify-content: center;
    }
    #confirmOverlay.show { display: flex; }
    .confirm-box {
      background: white; border-radius: 12px; padding: 24px;
      max-width: 400px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .confirm-box h3 { margin-bottom: 12px; }
    .confirm-info { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 0.88rem; line-height: 1.8; }
    .confirm-btns { display: flex; gap: 10px; }
    .confirm-btns button { flex: 1; padding: 9px; border-radius: 6px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    #btnConfirm { background: #6366f1; color: white; }
    #btnCancel  { background: #e5e7eb; color: #333; }

    /* Success */
    #successScreen { display: none; text-align: center; padding: 40px 0; }
    #successScreen.show { display: block; }
    #successScreen h2 { color: #16a34a; }
  </style>
</head>
<body>

  <div id="mainContent">
    <h1> Form Đặt Hàng</h1>
    <p class="sub">Bài 2.2 – Validation nâng cao với tính tổng tiền & xác nhận đơn</p>

    <!-- Tổng tiền -->
    <div class="price-box">
      <div class="label">
        <div style="font-weight:600; margin-bottom:2px">Tổng tiền</div>
        <div id="selectedProductName" style="color:#999;font-size:0.8rem">Chưa chọn sản phẩm</div>
      </div>
      <div class="amount" id="totalPrice">0 ₫</div>
    </div>

    <form id="orderForm" novalidate>

      <div class="form-row">
        <div class="form-group">
          <label for="product">Tên sản phẩm</label>
          <select id="product">
            <option value="">-- Chọn sản phẩm --</option>
            <option value="Áo thun basic">Áo thun basic</option>
            <option value="Quần jeans slim">Quần jeans slim</option>
            <option value="Giày sneaker">Giày sneaker</option>
            <option value="Túi canvas">Túi canvas</option>
            <option value="Nón bucket">Nón bucket</option>
          </select>
          <div class="error-msg" id="err-product"></div>
        </div>
        <div class="form-group">
          <label for="quantity">Số lượng (1 – 99)</label>
          <input type="number" id="quantity" min="1" max="99" placeholder="Nhập số lượng">
          <div class="error-msg" id="err-quantity"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="deliveryDate">Ngày giao hàng</label>
          <input type="date" id="deliveryDate">
          <div class="error-msg" id="err-deliveryDate"></div>
        </div>
        <div class="form-group">
          <label for="address">Địa chỉ giao hàng</label>
          <input type="text" id="address" placeholder="Số nhà, đường, phường, quận...">
          <div class="error-msg" id="err-address"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="note">Ghi chú <span style="font-weight:400">(không bắt buộc, tối đa 200 ký tự)</span></label>
        <textarea id="note" placeholder="Ghi chú thêm về đơn hàng..."></textarea>
        <div class="char-count" id="noteCount">0/200</div>
        <div class="error-msg" id="err-note"></div>
      </div>

      <hr>
      <div class="form-group">
        <label>Phương thức thanh toán</label>
        <div class="payment-group">
          <label><input type="radio" name="payment" value="COD">  COD</label>
          <label><input type="radio" name="payment" value="Chuyển khoản">  Chuyển khoản</label>
          <label><input type="radio" name="payment" value="Ví điện tử"> Ví điện tử</label>
        </div>
        <div class="error-msg" id="err-payment"></div>
      </div>

      <button type="submit">Đặt hàng ngay →</button>
    </form>
  </div>

  <!-- Màn hình thành công -->
  <div id="successScreen">
    <div style="font-size:3rem"></div>
    <h2>Đặt hàng thành công!</h2>
    <p id="successSummary"></p>
  </div>

  <!-- Hộp xác nhận -->
  <div id="confirmOverlay">
    <div class="confirm-box">
      <h3> Xác nhận đơn hàng</h3>
      <div class="confirm-info" id="confirmInfo"></div>
      <div class="confirm-btns">
        <button id="btnCancel">← Hủy</button>
        <button id="btnConfirm">Xác nhận ✓</button>
      </div>
    </div>
  </div>

  <script src="JS2-2.js"></script>
</body>
</html>
